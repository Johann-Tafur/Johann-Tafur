<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
  <title id="title">Brújula digital</title>
  <desc id="desc">Brújula tecnológica original con nodos luminosos que representa metas de aprendizaje.</desc>
  <defs>
    <radialGradient id="core">
      <stop offset="0" stop-color="#FF2BD6" stop-opacity=".8"/>
      <stop offset=".5" stop-color="#7C3AED" stop-opacity=".3"/>
      <stop offset="1" stop-color="#050510" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00D9FF"/>
      <stop offset=".5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#FF1744"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="180" height="180" rx="24" fill="#050510"/>
  <circle cx="90" cy="90" r="68" fill="url(#core)" stroke="#090A1A" stroke-width="2"/>
  <g fill="none" stroke="url(#ring)" filter="url(#glow)">
    <circle cx="90" cy="90" r="57" stroke-width="2" stroke-dasharray="4 7">
      <animateTransform attributeName="transform" type="rotate" from="0 90 90" to="360 90 90" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="90" r="42" stroke-width="1" stroke-dasharray="20 8">
      <animateTransform attributeName="transform" type="rotate" from="360 90 90" to="0 90 90" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M90 42l14 39-14 9-14-9z" fill="#00D9FF"/>
  <path d="M90 138l-14-39 14-9 14 9z" fill="#FF1744"/>
  <circle cx="90" cy="90" r="8" fill="#EAF7FF" stroke="#FF2BD6" stroke-width="3"/>
  <g fill="#EAF7FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">
    <text x="90" y="18">GOAL</text>
    <text x="90" y="169">BUILD</text>
    <text x="18" y="94">CODE</text>
    <text x="158" y="94">NEXT</text>
  </g>
</svg>
